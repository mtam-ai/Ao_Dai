<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Lịch sử mua hàng – Áo Dài Thanh Xuân</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    body{margin:0;font-family:"Montserrat",sans-serif}
    .history-page{background:linear-gradient(160deg,#fff8f5,#ffeaea,#fff5f5);min-height:100vh}
    .history-nav{background:#fff;border-bottom:1px solid #f0e8e8;padding:14px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(200,16,46,.07)}
    .brand-logo{font-size:22px;font-weight:900;color:#c8102e;cursor:pointer}
    .history-body{padding:32px 0 60px}
    .order-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(200,16,46,.07);margin-bottom:16px;transition:.25s}
    .order-card:hover{box-shadow:0 8px 32px rgba(200,16,46,.12);transform:translateY(-2px)}
    .order-card-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #f5f0f0;background:#fafafa;flex-wrap:wrap;gap:10px}
    .order-id{font-size:15px;font-weight:800;color:#1a1a1a}
    .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
    .badge-pending{color:#f59e0b;background:#fffbeb}.badge-confirmed{color:#3b82f6;background:#eff6ff}
    .badge-shipping{color:#8b5cf6;background:#f5f3ff}.badge-done{color:#10b981;background:#ecfdf5}
    .badge-cancelled{color:#6b7280;background:#f9fafb}
    .badge-awaiting{color:#d97706;background:#fffbeb}
    .order-items{padding:14px 20px;display:flex;flex-direction:column;gap:10px}
    .item-thumb{width:60px;height:76px;object-fit:cover;border-radius:10px;border:1.5px solid #f5f0f0;flex-shrink:0;background:#f5f0f0}
    .item-price{font-size:14px;font-weight:800;color:#c8102e;margin-left:auto;flex-shrink:0}
    .order-card-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#fafafa;border-top:1px solid #f5f0f0;flex-wrap:wrap;gap:8px}
    .total-val{font-size:17px;font-weight:900;color:#c8102e}
    .btn-track{border:1.5px solid #fde0e0;background:#fff5f5;color:#c8102e;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer}
    .btn-track:hover{background:#c8102e;color:#fff}
    .btn-cancel-order{border:1.5px solid #fcc;background:#fff;color:#dc3545;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer}
    .btn-cancel-order:hover{background:#dc3545;color:#fff}
    .login-required-box{background:#fff;border-radius:24px;padding:48px 40px;max-width:500px;margin:0 auto;box-shadow:0 15px 50px rgba(200,16,46,.1);text-align:center}
    .filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .tab-chip{background:#fff;border:1.5px solid #f0e0e0;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:#888;cursor:pointer}
    .tab-chip:hover,.tab-chip.active{background:#c8102e;color:#fff;border-color:#c8102e}
  </style>
</head>
<body>
<div class="history-page">
  <nav class="history-nav">
    <div class="container d-flex align-items-center justify-content-between">
      <span class="brand-logo" onclick="location.href='/client/home.html'">Áo Dài Thanh Xuân</span>
      <div class="d-flex align-items-center gap-2">
        <span style="font-size:13px;color:#c8102e;cursor:pointer" onclick="location.href='/client/home.html'">Trang chủ</span>
        <i class="bi bi-chevron-right" style="font-size:11px;color:#ccc"></i>
        <span style="font-size:13px;color:#888;font-weight:600">Lịch sử mua hàng</span>
      </div>
      <div id="userTag"></div>
    </div>
  </nav>

  <div id="loginRequired" class="container my-5 d-none">
    <div class="login-required-box">
      <div style="font-size:60px">🔒</div>
      <h4 class="fw-bold mt-3">Bạn cần đăng nhập</h4>
      <div class="d-flex gap-3 justify-content-center mt-4">
        <button class="btn btn-danger px-4 rounded-pill" onclick="location.href='/client/login.html'">Đăng nhập</button>
        <button class="btn btn-outline-danger px-4 rounded-pill" onclick="location.href='/client/home.html'">Về trang chủ</button>
      </div>
    </div>
  </div>

  <div id="mainContent" class="container history-body d-none">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <h3 style="font-size:26px;font-weight:800;color:#1a1a1a">📋 Lịch sử mua hàng</h3>
        <p class="text-muted mb-0" id="subTitle">Đang tải...</p>
      </div>
      <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="location.href='/client/home.html'"><i class="bi bi-bag me-1"></i>Tiếp tục mua sắm</button>
    </div>
    <div class="filter-tabs" id="filterTabs"></div>
    <div id="emptyState" class="text-center py-5 bg-white rounded-4 shadow-sm d-none">
      <div style="font-size:72px">📦</div>
      <h5 id="emptyTitle">Bạn chưa có đơn hàng nào</h5>
      <p class="text-muted small" id="emptyDesc">Hãy mua sắm để tạo đơn hàng đầu tiên!</p>
    </div>
    <div id="orderList"></div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  let myOrders = [], filterStatus = '';
  let productImageMap = {};   // id → image URL

  async function loadProductImages() {
    try {
      const products = await api.products.getAll();
      products.forEach(p => { if (p.id && p.image) productImageMap[p.id] = p.image; });
    } catch(_) {}
  }

  function getItemImage(item) {
    // Ưu tiên image lưu trong order, fallback về productImageMap theo id
    if (item.image && item.image.trim() !== '') return item.image;
    if (item.id && productImageMap[item.id]) return productImageMap[item.id];
    return '';
  }
  const user = session.get('customerSession');
  const statusInfo = {
    awaiting_payment:{label:'Chờ thanh toán',cls:'badge-awaiting'},
    pending:{label:'Chờ xác nhận',cls:'badge-pending'},confirmed:{label:'Đã xác nhận',cls:'badge-confirmed'},
    shipping:{label:'Đang giao',cls:'badge-shipping'},done:{label:'Hoàn thành',cls:'badge-done'},cancelled:{label:'Đã hủy',cls:'badge-cancelled'}
  };
  const tabs = [
    {value:'',label:'Tất cả'},{value:'awaiting_payment',label:'Chờ thanh toán'},{value:'pending',label:'Chờ xác nhận'},{value:'confirmed',label:'Đã xác nhận'},
    {value:'shipping',label:'Đang giao'},{value:'done',label:'Hoàn thành'},{value:'cancelled',label:'Đã hủy'}
  ];

  async function init() {
    if (!user) { document.getElementById('loginRequired').classList.remove('d-none'); return; }
    document.getElementById('mainContent').classList.remove('d-none');
    document.getElementById('userTag').innerHTML = `<i class="bi bi-person-circle me-1 text-danger"></i><span>${user.name}</span>`;
    renderTabs();
    try {
      [myOrders] = await Promise.all([api.orders.getMyOrders(), loadProductImages()]);
      document.getElementById('subTitle').textContent = `Xin chào ${user.name} — bạn có ${myOrders.length} đơn hàng`;
      renderOrders();
    } catch(e) { document.getElementById('subTitle').textContent = 'Lỗi tải đơn hàng'; }
  }

  function renderTabs() {
    document.getElementById('filterTabs').innerHTML = tabs.map(t =>
            `<button class="tab-chip ${filterStatus===t.value?'active':''}" onclick="setStatus('${t.value}')">${t.label}</button>`
    ).join('');
  }

  function setStatus(val) { filterStatus=val; renderTabs(); renderOrders(); }

  // Lưu map đơn hàng để trackOrder truy cập nhanh
  let orderMap = {};

  function renderOrders() {
    let list = [...myOrders];
    if (filterStatus) list = list.filter(o=>o.status===filterStatus);
    list.sort((a,b)=>new Date(b.orderDate||0)-new Date(a.orderDate||0));
    // Cập nhật map
    myOrders.forEach(o => { orderMap[o.id] = o; });
    const listEl = document.getElementById('orderList');
    const emptyEl = document.getElementById('emptyState');
    if (!list.length) {
      listEl.innerHTML=''; emptyEl.classList.remove('d-none');
      document.getElementById('emptyTitle').textContent = filterStatus ? 'Không có đơn ở trạng thái này' : 'Bạn chưa có đơn hàng nào';
      document.getElementById('emptyDesc').textContent = filterStatus ? 'Thử chọn trạng thái khác' : 'Hãy mua sắm để tạo đơn hàng đầu tiên!';
      return;
    }
    emptyEl.classList.add('d-none');
    listEl.innerHTML = list.map(order => {
      const info = statusInfo[order.status]||{label:order.status,cls:'badge-pending'};
      let items = []; try { items = JSON.parse(order.items||'[]'); } catch{}
      const shown = items.slice(0,2); const extra = items.length-2;
      const date = order.orderDate ? new Date(order.orderDate).toLocaleDateString('vi-VN') : '';
      return `<div class="order-card">
        <div class="order-card-head">
          <div><span class="order-id">#${String(order.id).slice(-6)}</span><span class="text-muted small ms-2"><i class="bi bi-clock me-1"></i>${date}</span></div>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="status-badge ${info.cls}"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>${info.label}</span>
            <button class="btn-track" onclick="trackOrder(${order.id})"><i class="bi bi-geo-alt me-1"></i>Theo dõi</button>
            ${order.status==='pending'?`<button class="btn-cancel-order" onclick="cancelOrder(${order.id})"><i class="bi bi-x-circle me-1"></i>Hủy đơn</button>`:''}
          </div>
        </div>
        <div class="order-items">
          ${shown.map(item=>`<div class="d-flex align-items-center gap-3">
            <img src="${getItemImage(item)}" class="item-thumb" onerror="this.src='';this.onerror=null;"/>
            <div style="flex:1"><div style="font-size:13px;font-weight:700">${item.name}</div><div style="font-size:11px;color:#aaa">${item.size?`Size ${item.size} | `:''}x${item.qty}</div></div>
            <div class="item-price">${fp(item.price*item.qty)}</div>
          </div>`).join('')}
          ${extra>0?`<div style="font-size:12px;color:#aaa"><i class="bi bi-three-dots me-1"></i>và ${extra} sản phẩm khác</div>`:''}
        </div>
        <div class="order-card-foot">
          <div>
            <span class="payment-tag badge bg-light text-dark">${order.payment==='bank'?'🏦 Chuyển khoản':'💵 COD'}</span>
            ${order.status==='awaiting_payment'?`<button class="btn-track ms-2" onclick="trackOrder(${order.id})" style="background:#fff3cd;border-color:#ffe082;color:#856404"><i class="bi bi-qr-code me-1"></i>Thanh toán ngay</button>`:''}
          </div>
          <div><span class="text-muted small">Tổng cộng:</span><span class="total-val ms-2">${fp(order.total)}</span></div>
        </div>
      </div>`;
    }).join('');
  }

  function trackOrder(id) {
    try {
      // Dùng == để khớp cả string lẫn number
      const order = orderMap[id] || myOrders.find(o => o.id == id);
      if (order) localStorage.setItem('orderCache_' + id, JSON.stringify(order));
    } catch(_) {}
    location.href = '/client/order-tracking.html?id=' + id;
  }

  async function cancelOrder(id) {
    if (!confirm(`Bạn có chắc muốn hủy đơn hàng #${String(id).slice(-6)}?`)) return;
    try {
      await api.orders.updateStatus(id, 'cancelled');
      myOrders = await api.orders.getMyOrders();
      renderOrders();
    } catch(e) { alert(e.message||'Lỗi hủy đơn hàng'); }
  }

  function fp(p){return Number(p).toLocaleString('vi-VN')+' đ';}
  init();
</script>
</body></html>
