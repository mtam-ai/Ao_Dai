<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Khách hàng – TranThai Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
<style>
body{margin:0;font-family:"Montserrat",sans-serif;background:#f8f9fa}
.admin-layout{display:flex;min-height:100vh}
.admin-sidebar{width:230px;background:linear-gradient(180deg,#c8102e,#7a0b1c);padding:24px 16px;min-height:100vh;position:sticky;top:0;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-brand{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar-nav{flex:1;margin-top:12px}
.sidebar-link{display:block;color:rgba(255,255,255,.8);text-decoration:none;padding:11px 14px;border-radius:12px;margin-bottom:4px;font-weight:500;transition:.2s;font-size:14px}
.sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,.2);color:#fff}
.sidebar-footer{border-top:1px solid rgba(255,255,255,.2);padding-top:16px}
.content-area{flex:1;padding:28px}
.table-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
thead th{background:#f8f8f8;padding:10px 14px;font-size:12px;font-weight:700;color:#888;text-transform:uppercase}
tbody td{padding:12px 14px;font-size:13px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
tbody tr:hover td{background:#fafafa}
.status-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.chip-active{background:#e8f5e9;color:#1b5e20}.chip-locked{background:#fdecea;color:#b71c1c}
.act-btn{font-size:12px;font-weight:600;border-radius:20px;padding:5px 12px;cursor:pointer;border:1.5px solid;transition:.2s}
.lock-btn{border-color:#fcc;color:#c8102e;background:#fff}.lock-btn:hover{background:#c8102e;color:#fff}
.unlock-btn{border-color:#b7ebc8;color:#1b5e20;background:#fff}.unlock-btn:hover{background:#28a745;color:#fff}
.stat-strip{background:#fff;border-radius:14px;padding:14px 24px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.06);display:flex;gap:0}
.strip-item{flex:1;text-align:center}.strip-num{font-size:22px;font-weight:800;color:#c8102e}.strip-label{font-size:11px;color:#aaa}
.strip-div{width:1px;background:#f0e0e0;margin:0 8px}
</style>
</head><body>
<div class="admin-layout">
  <div class="admin-sidebar">
    <div class="sidebar-brand">Admin</div>
    <nav class="sidebar-nav">
      <a href="/" class="sidebar-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
      <a href="/admin/staff.html" class="sidebar-link"><i class="bi bi-people me-2"></i>Nhân viên</a>
      <a href="/admin/customers.html" class="sidebar-link active"><i class="bi bi-person-lines-fill me-2"></i>Khách hàng</a>
      <a href="/admin/orders.html" class="sidebar-link"><i class="bi bi-bag-check me-2"></i>Hóa đơn</a>
      <a href="/admin/products.html" class="sidebar-link"><i class="bi bi-box me-2"></i>Sản phẩm</a>
      <a href="/admin/sales.html" class="sidebar-link"><i class="bi bi-graph-up me-2"></i>Doanh thu</a>
    </nav>
    <div class="sidebar-footer">
      <div style="font-size:12px;color:rgba(255,255,255,.5)">Đăng nhập với tư cách</div>
      <div style="font-weight:700;color:#fff;font-size:14px" id="adminName">Admin</div>
      <button class="btn btn-sm btn-outline-light mt-2 w-100" onclick="doLogout()"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
    </div>
  </div>
  <div class="content-area">
    <div class="d-flex justify-content-between mb-3">
      <h3 class="fw-bold">Quản lý khách hàng</h3>
      <div class="d-flex gap-2">
        <input id="searchInput" class="form-control form-control-sm" placeholder="Tìm tên, email, SĐT..." oninput="filterList()" style="width:240px"/>
        <select id="statusFilter" class="form-select form-select-sm" style="width:140px" onchange="filterList()">
          <option value="">Tất cả</option><option value="ACTIVE">Hoạt động</option><option value="BANNED">Đã khóa</option>
        </select>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadData()"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>
    <div class="stat-strip">
      <div class="strip-item"><div class="strip-num" id="statTotal">–</div><div class="strip-label">Tổng KH</div></div>
      <div class="strip-div"></div>
      <div class="strip-item"><div class="strip-num" id="statActive" style="color:#28a745">–</div><div class="strip-label">Hoạt động</div></div>
      <div class="strip-div"></div>
      <div class="strip-item"><div class="strip-num" id="statLocked" style="color:#dc3545">–</div><div class="strip-label">Đã khóa</div></div>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>#</th><th>Khách hàng</th><th>Liên hệ</th><th>Địa chỉ</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6" class="text-center py-4"><div class="spinner-border spinner-border-sm text-danger"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  const sess = session.get('adminSession');
  if (!sess) location.href = '/admin/login.html';
  document.getElementById('adminName').textContent = sess?.name || 'Admin';
  let customers = [];
  async function loadData() {
    try {
      customers = await api.customers.getAll();
      document.getElementById('statTotal').textContent = customers.length;
      document.getElementById('statActive').textContent = customers.filter(c=>c.status==='ACTIVE').length;
      document.getElementById('statLocked').textContent = customers.filter(c=>c.status==='BANNED').length;
      filterList();
    } catch(e) { console.error(e); }
  }
  function filterList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const st = document.getElementById('statusFilter').value;
    let list = customers.filter(c => {
      const mq = !q||(c.name||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q)||(c.phone||'').includes(q);
      return mq && (!st || c.status===st);
    });
    const tb = document.getElementById('tableBody');
    if (!list.length) { tb.innerHTML='<tr><td colspan="6" class="text-center text-muted py-4">Không tìm thấy khách hàng</td></tr>'; return; }
    tb.innerHTML = list.map((c,i) => {
      const isLocked = c.status === 'BANNED';
      return `<tr>
        <td class="text-muted small">${i+1}</td>
        <td><div class="fw-semibold">${c.name||'—'}</div><small class="text-muted">${c.createdAt?new Date(c.createdAt).toLocaleDateString('vi-VN'):''}</small></td>
        <td><small>${c.phone||'—'}<br><span class="text-muted">${c.email||'—'}</span></small></td>
        <td class="small text-muted">${(c.address||'—').slice(0,40)}</td>
        <td><span class="status-chip ${isLocked?'chip-locked':'chip-active'}">${isLocked?'Đã khóa':'Hoạt động'}</span></td>
        <td>${isLocked
          ? `<button class="act-btn unlock-btn" onclick="setStatus(${c.id},'ACTIVE')"><i class="bi bi-unlock me-1"></i>Mở khóa</button>`
          : `<button class="act-btn lock-btn" onclick="setStatus(${c.id},'BANNED')"><i class="bi bi-lock me-1"></i>Khóa</button>`}
        </td>
      </tr>`;
    }).join('');
  }
  async function setStatus(id, status) {
    const label = status === 'BANNED' ? 'khóa' : 'mở khóa';
    if (!confirm(`Bạn có chắc muốn ${label} tài khoản này?`)) return;
    try {
      await api.customers.updateStatus(id, status);
      loadData();
    } catch(e) { alert(e.message); }
  }
  function doLogout(){if(confirm('Bạn có chắc muốn đăng xuất?')){session.remove('adminSession');location.href='/admin/login.html';}}
  loadData();
</script>
</body></html>
