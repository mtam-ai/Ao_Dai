<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Đăng nhập Admin – TranThai</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    .login-page{min-height:100vh;background:#f8f9fa;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .bg-circles{position:fixed;inset:0;pointer-events:none;z-index:0}
    .circle{position:absolute;border-radius:50%;opacity:.07;background:#c8102e}
    .c1{width:500px;height:500px;top:-200px;left:-200px}.c2{width:350px;height:350px;bottom:-100px;right:-100px}
    .login-container{display:flex;width:860px;max-width:96vw;min-height:520px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 25px 80px rgba(200,16,46,.15);position:relative;z-index:1}
    .left-panel{width:360px;background:linear-gradient(160deg,#c8102e,#7a0b1c);padding:48px 40px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center}
    .brand-big{font-size:38px;font-weight:900;letter-spacing:2px}
    .right-panel{flex:1;padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
    .input-group-text{background:#fff5f5;border-color:#eee;color:#c8102e}
    .form-control{border-color:#eee;padding:10px 14px}
    .form-control:focus{border-color:#c8102e;box-shadow:0 0 0 .15rem rgba(200,16,46,.15)}
    .btn-login{background:linear-gradient(90deg,#c8102e,#a60d1f);color:#fff;border:none;border-radius:14px;padding:12px;font-weight:700;font-size:15px;transition:.3s}
    .btn-login:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(200,16,46,.3);color:#fff}
    .hint-box{background:#fff8f8;border-radius:12px;padding:12px 16px;border:1px solid #fde8e8}
  </style>
</head>
<body>
<div class="login-page">
  <div class="bg-circles"><div class="circle c1"></div><div class="circle c2"></div></div>
  <div class="login-container">
    <div class="left-panel d-none d-lg-flex flex-column justify-content-center align-items-center">
      <div class="brand-big">TranThai</div>
      <p style="opacity:.75;font-size:15px;margin-top:4px">Hệ thống quản trị</p>
      <div class="mt-4 d-flex flex-column gap-2">
        <div style="background:rgba(255,255,255,.1);padding:10px 14px;border-radius:12px;font-size:14px">📊 Báo cáo doanh thu</div>
        <div style="background:rgba(255,255,255,.1);padding:10px 14px;border-radius:12px;font-size:14px">📦 Quản lý sản phẩm</div>
        <div style="background:rgba(255,255,255,.1);padding:10px 14px;border-radius:12px;font-size:14px">👥 Quản lý nhân viên</div>
        <div style="background:rgba(255,255,255,.1);padding:10px 14px;border-radius:12px;font-size:14px">🛒 Quản lý đơn hàng</div>
      </div>
    </div>
    <div class="right-panel">
      <div style="max-width:340px">
        <h4 class="fw-bold mb-1">Đăng nhập Admin</h4>
        <p class="text-muted small mb-4">Chỉ dành cho quản trị viên</p>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input id="email" type="email" class="form-control" placeholder="admin@tranthai.vn"/>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Mật khẩu</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input id="password" type="password" class="form-control" placeholder="••••••••" onkeyup="if(event.key==='Enter')doLogin()"/>
            <button class="input-group-text" type="button" onclick="togglePw()"><i class="bi bi-eye" id="eyeIcon"></i></button>
          </div>
        </div>
        <div id="errorMsg" class="alert alert-danger py-2 small d-none"></div>
        <button class="btn btn-login w-100" onclick="doLogin()" id="loginBtn">Đăng nhập</button>
        <div class="hint-box mt-4">
          <small class="text-muted"><i class="bi bi-info-circle me-1"></i>Tài khoản mặc định: <strong>admin@tranthai.vn</strong> / <strong>admin123</strong></small>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  // Nếu đã đăng nhập thì redirect
  if (session.get('adminSession')) location.href = '/admin/dashboard.html';

  function togglePw() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    icon.className = pw.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  }

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('errorMsg');
    errEl.classList.add('d-none');
    if (!email || !password) { errEl.textContent = 'Vui lòng nhập đầy đủ thông tin'; errEl.classList.remove('d-none'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
    try {
      const data = await api.auth.adminLogin(email, password);
      session.set('adminSession', data);
      location.href = '/admin/dashboard.html';
    } catch (e) {
      errEl.textContent = e.message || 'Email hoặc mật khẩu không đúng!';
      errEl.classList.remove('d-none');
      btn.disabled = false; btn.innerHTML = 'Đăng nhập';
    }
  }
</script>
</body>
</html>
