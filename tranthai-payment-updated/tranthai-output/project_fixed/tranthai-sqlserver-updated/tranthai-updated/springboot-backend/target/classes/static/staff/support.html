<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hỗ trợ KH – Nhân viên TranThai</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
<style>
body{margin:0;font-family:"Montserrat",sans-serif}.staff-layout{display:flex;min-height:100vh}
.staff-sidebar{width:230px;background:linear-gradient(180deg,#c8102e,#7a0b1c);padding:24px 16px;min-height:100vh;position:sticky;top:0;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-brand{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar-nav{flex:1;margin-top:12px}.sidebar-link{display:block;color:rgba(255,255,255,.8);text-decoration:none;padding:11px 14px;border-radius:12px;margin-bottom:4px;font-weight:500;transition:.2s;font-size:14px}
.sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,.2);color:#fff}.sidebar-footer{border-top:1px solid rgba(255,255,255,.2);padding-top:16px}
.sidebar-footer-name{font-weight:700;color:#fff;font-size:14px}
.content{flex:1;padding:40px;background:linear-gradient(135deg,#fff6f0,#ffeaea);min-height:100vh}
.support-layout{display:grid;grid-template-columns:280px 1fr;gap:0;height:calc(100vh - 140px);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(200,16,46,.1)}
.conv-list{border-right:1px solid #f0e0e0;display:flex;flex-direction:column;overflow:hidden}
.conv-items-wrap{flex:1;overflow-y:auto}
.conv-item{padding:12px 14px;cursor:pointer;border-bottom:1px solid #fdf0f0;transition:.15s;display:flex;align-items:center;gap:10px}
.conv-item:hover{background:#fff8f8}.conv-item.active{background:#fff0f0;border-left:3px solid #c8102e}
.conv-avatar{width:38px;height:38px;border-radius:50%;background:#c8102e;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conv-name{font-weight:700;font-size:13px}.conv-last{font-size:11px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-panel{display:flex;flex-direction:column;overflow:hidden}
.chat-header{background:#fff8f8;padding:14px 18px;border-bottom:1px solid #f0e0e0;display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex}.msg-right{justify-content:flex-end}.msg-left{justify-content:flex-start}
.msg-bubble{max-width:70%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5}
.bubble-staff{background:#c8102e;color:#fff;border-radius:16px 16px 4px 16px}
.bubble-customer{background:#f5f5f5;color:#1a1a1a;border-radius:16px 16px 16px 4px}
.msg-time{display:block;font-size:10px;opacity:.6;margin-top:4px;text-align:right}
.chat-input-row{padding:10px 14px;border-top:1px solid #f0e0e0;display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-input{border-radius:20px;border:1.5px solid #f0e0e0;padding:8px 16px;font-size:13px;flex:1}
.chat-input:focus{border-color:#c8102e;box-shadow:none;outline:none}
.send-btn{width:38px;height:38px;border-radius:50%;background:#c8102e;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.send-btn:hover{background:#a60d1f}
.no-conv-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center}
</style>
</head><body>
<div class="staff-layout">
  <div class="staff-sidebar">
    <div class="sidebar-brand">Nhân viên</div>
    <nav class="sidebar-nav">
      <a href="/staff/orders.html" class="sidebar-link"><i class="bi bi-bag-check me-2"></i>Đơn hàng</a>
      <a href="/staff/products.html" class="sidebar-link"><i class="bi bi-box me-2"></i>Sản phẩm</a>
      <a href="/staff/support.html" class="sidebar-link active"><i class="bi bi-chat-dots me-2"></i>Hỗ trợ KH</a>
      <a href="/staff/sales.html" class="sidebar-link"><i class="bi bi-graph-up me-2"></i>Doanh thu</a>
    </nav>
    <div class="sidebar-footer">
      <div class="small text-white-50">Đăng nhập với tư cách</div>
      <div class="sidebar-footer-name" id="staffName">Nhân viên</div>
      <button class="btn btn-sm btn-outline-light mt-2 w-100" onclick="doLogout()">Đăng xuất</button>
    </div>
  </div>
  <div class="content">
    <h3 class="fw-bold mb-4" style="color:#c8102e">Hỗ trợ khách hàng</h3>
    <div class="support-layout">
      <div class="conv-list">
        <div style="padding:12px 14px 0"><input id="searchConv" class="form-control form-control-sm" placeholder="🔍 Tìm khách hàng..." oninput="renderConvList()"/></div>
        <div class="conv-items-wrap mt-2" id="convItemsWrap"></div>
      </div>
      <div class="chat-panel">
        <div class="no-conv-placeholder" id="noConvMsg"><div><i class="bi bi-chat-dots fs-1 d-block mb-2"></i>Chọn cuộc hội thoại</div></div>
        <div id="chatArea" class="d-none" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
          <div class="chat-header" id="chatHeader"></div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-row">
            <input id="chatInput" class="form-control chat-input" placeholder="Nhập tin nhắn..." onkeyup="if(event.key==='Enter')sendMessage()"/>
            <button class="send-btn" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  const sess = session.get('staffSession');
  if (!sess) location.href = '/staff/login.html';
  document.getElementById('staffName').textContent = sess?.name || 'Nhân viên';
  let convs = [], selectedId = null;

  async function loadConvs() {
    try { convs = await api.support.getAll(); renderConvList(); if(selectedId) renderChat(); }
    catch(e) { console.error(e); }
  }

  function renderConvList() {
    const q = document.getElementById('searchConv').value.toLowerCase();
    const list = convs.filter(c => !q || (c.customerName||'').toLowerCase().includes(q));
    const wrap = document.getElementById('convItemsWrap');
    if (!list.length) { wrap.innerHTML='<div class="text-center text-muted small mt-4 p-3">Chưa có tin nhắn</div>'; return; }
    wrap.innerHTML = list.map(c => {
      let msgs = []; try { msgs = JSON.parse(c.messages||'[]'); } catch{}
      const last = msgs[msgs.length-1];
      const lastText = last?.text || (last?.image ? '📷 Hình ảnh' : '');
      return `<div class="conv-item${selectedId===c.id?' active':''}" onclick="selectConv(${c.id})">
        <div class="conv-avatar">${(c.customerName||'?')[0]}</div>
        <div style="flex:1;overflow:hidden">
          <div class="conv-name">${c.customerName||'—'}</div>
          <div class="conv-last">${lastText}</div>
        </div>
      </div>`;
    }).join('');
  }

  async function selectConv(id) {
    selectedId = id;
    const conv = convs.find(c=>c.id===id); if(!conv) return;
    renderConvList();
    document.getElementById('noConvMsg').classList.add('d-none');
    const ca = document.getElementById('chatArea'); ca.classList.remove('d-none'); ca.style.display='flex';
    document.getElementById('chatHeader').innerHTML = `
      <div class="conv-avatar" style="width:32px;height:32px;font-size:13px">${(conv.customerName||'?')[0]}</div>
      <div><div class="fw-bold">${conv.customerName||'—'}</div><div class="small text-muted">ID: ${conv.customerId||'—'}</div></div>`;
    renderChat();
  }

  function renderChat() {
    const conv = convs.find(c=>c.id===selectedId); if(!conv) return;
    let msgs = []; try { msgs = JSON.parse(conv.messages||'[]'); } catch{}
    const el = document.getElementById('chatMessages');
    el.innerHTML = msgs.map(m => `<div class="msg-row ${m.sender==='staff'?'msg-right':'msg-left'}">
      <div class="msg-bubble ${m.sender==='staff'?'bubble-staff':'bubble-customer'}">
        ${m.text?`<span>${m.text}</span>`:''}
        <span class="msg-time">${m.time||''}</span>
      </div>
    </div>`).join('');
    el.scrollTop = el.scrollHeight;
  }

  async function sendMessage() {
    const text = document.getElementById('chatInput').value.trim();
    if (!text || !selectedId) return;
    try {
      await api.support.sendMessage(selectedId, 'staff', text);
      document.getElementById('chatInput').value = '';
      loadConvs();
    } catch(e) { console.error(e); }
  }

  function doLogout(){session.remove('staffSession');location.href='/staff/login.html';}
  loadConvs(); setInterval(loadConvs, 5000);
</script>
</body></html>
