<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Trang cá nhân – Áo Dài Thanh Xuân</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    body{margin:0;font-family:"Montserrat",sans-serif;background:linear-gradient(135deg,#fff5f5,#ffeaea);min-height:100vh}
    .profile-wrapper{display:grid;grid-template-columns:260px 1fr;gap:24px;max-width:1000px;margin:32px auto 60px;padding:0 16px}
    .profile-sidebar{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 32px rgba(200,16,46,.1);position:sticky;top:80px;height:fit-content}
    .avatar-circle{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#c8102e,#a60d1f);display:flex;align-items:center;justify-content:center}
    .avatar-initials{font-size:26px;font-weight:800;color:#fff}
    .side-nav-item{display:flex;align-items:center;padding:11px 14px;border-radius:14px;font-size:14px;font-weight:500;color:#555;cursor:pointer;transition:.2s;text-decoration:none;margin-bottom:4px}
    .side-nav-item:hover{background:#fff5f5;color:#c8102e}
    .side-nav-item.active{background:linear-gradient(90deg,#c8102e,#a60d1f);color:#fff;font-weight:700}
    .profile-main{display:flex;flex-direction:column;gap:20px}
    .form-card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 32px rgba(200,16,46,.07)}
    .input-group-text{background:#fff5f5;border-color:#eee;color:#c8102e}
    .form-control{border-color:#eee;padding:10px 14px}
    .form-control:focus{border-color:#c8102e;box-shadow:0 0 0 .15rem rgba(200,16,46,.15)}
    .btn-eye{cursor:pointer;background:#fff5f5;border-color:#eee}
    .btn-main{background:linear-gradient(90deg,#c8102e,#a60d1f);color:#fff;border:none;border-radius:14px;padding:10px 28px;font-size:14px;font-weight:700;cursor:pointer;transition:.3s}
    .btn-main:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(200,16,46,.3)}
    .btn-main:disabled{opacity:.6;cursor:not-allowed}
    .tab-btn{background:#fff;border:1.5px solid #f0e0e0;border-radius:20px;padding:8px 20px;font-size:13px;font-weight:600;color:#888;cursor:pointer;transition:.2s}
    .tab-btn:hover{border-color:#c8102e;color:#c8102e}
    .tab-btn.active{background:#c8102e;color:#fff;border-color:#c8102e}
    .tab-content{display:none}.tab-content.active{display:block}
    .alert-msg{border-radius:12px;padding:10px 14px;font-size:13px;margin-top:12px}
    .alert-err{background:#fff5f5;border:1px solid #fcc;color:#c8102e}
    .alert-ok{background:#f0fff4;border:1px solid #b7ebc8;color:#155724}
    @media(max-width:768px){.profile-wrapper{grid-template-columns:1fr}.profile-sidebar{position:static}}
  </style>
</head>
<body>
<div id="loginRequiredBox" class="container my-5 d-none">
  <div class="text-center" style="background:#fff;border-radius:24px;padding:48px 40px;max-width:500px;margin:0 auto;box-shadow:0 15px 50px rgba(200,16,46,.1)">
    <div style="font-size:60px">🔒</div>
    <h4 class="fw-bold mt-3">Bạn cần đăng nhập</h4>
    <button class="btn btn-danger px-4 rounded-pill mt-3" onclick="location.href='/client/login.html'">Đăng nhập</button>
  </div>
</div>
<div class="profile-wrapper" id="profileWrapper" style="display:none">
  <div class="profile-sidebar">
    <div class="text-center mb-4">
      <div style="position:relative;display:inline-block;margin-bottom:12px">
        <div class="avatar-circle"><span class="avatar-initials" id="avatarInitials">?</span></div>
      </div>
      <div style="font-size:16px;font-weight:700;color:#1a1a1a" id="sidebarName">–</div>
      <div style="font-size:12px;color:#aaa" id="sidebarEmail">–</div>
    </div>
    <nav>
      <a class="side-nav-item active"><i class="bi bi-person-circle me-2"></i>Thông tin cá nhân</a>
      <a class="side-nav-item" onclick="location.href='/client/order-history.html'"><i class="bi bi-bag-heart me-2"></i>Lịch sử đơn hàng</a>
      <a class="side-nav-item" style="color:#dc3545" onclick="doLogout()"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a>
    </nav>
  </div>
  <div class="profile-main">
    <div class="d-flex justify-content-between align-items-end">
      <div><h4 style="font-size:22px;font-weight:800;color:#1a1a1a;margin-bottom:2px">Thông tin cá nhân</h4><p style="font-size:13px;color:#aaa;margin:0">Quản lý thông tin tài khoản của bạn</p></div>
      <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="location.href='/client/home.html'"><i class="bi bi-arrow-left me-1"></i>Về trang chủ</button>
    </div>
    <div class="d-flex gap-2">
      <button class="tab-btn active" onclick="switchTab('info',this)"><i class="bi bi-person me-1"></i>Thông tin cơ bản</button>
      <button class="tab-btn" onclick="switchTab('password',this)"><i class="bi bi-shield-lock me-1"></i>Đổi mật khẩu</button>
    </div>
    <div id="tab-info" class="form-card tab-content active">
      <div class="fw-bold text-danger mb-3 small"><i class="bi bi-person-badge me-2"></i>Thông tin cơ bản</div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label small fw-semibold">Họ và tên *</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input id="infoName" class="form-control"/></div></div>
        <div class="col-md-6"><label class="form-label small fw-semibold">Số điện thoại</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-telephone"></i></span><input id="infoPhone" type="tel" class="form-control"/></div></div>
        <div class="col-12"><label class="form-label small fw-semibold">Email *</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input id="infoEmail" type="email" class="form-control"/></div></div>
        <div class="col-12"><label class="form-label small fw-semibold">Địa chỉ nhận hàng</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-geo-alt"></i></span><input id="infoAddress" class="form-control"/></div></div>
      </div>
      <div id="infoMsg" class="alert-msg d-none"></div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-outline-secondary rounded-pill" onclick="resetInfoForm()"><i class="bi bi-arrow-counterclockwise me-1"></i>Hoàn tác</button>
        <button class="btn-main" id="saveInfoBtn" onclick="saveInfo()">💾 Lưu thay đổi</button>
      </div>
    </div>
    <div id="tab-password" class="form-card tab-content">
      <div class="fw-bold text-danger mb-3 small"><i class="bi bi-shield-lock me-2"></i>Đổi mật khẩu</div>
      <div class="mb-3"><label class="form-label small fw-semibold">Mật khẩu hiện tại *</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input id="pwCurrent" type="password" class="form-control"/>
          <button class="input-group-text btn-eye" onclick="togglePw('pwCurrent','eyeCur')"><i class="bi bi-eye" id="eyeCur"></i></button></div></div>
      <div class="mb-3"><label class="form-label small fw-semibold">Mật khẩu mới *</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input id="pwNew" type="password" class="form-control" placeholder="Tối thiểu 6 ký tự"/>
          <button class="input-group-text btn-eye" onclick="togglePw('pwNew','eyeNew')"><i class="bi bi-eye" id="eyeNew"></i></button></div></div>
      <div class="mb-3"><label class="form-label small fw-semibold">Xác nhận mật khẩu mới *</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input id="pwConfirm" type="password" class="form-control" onkeyup="if(event.key==='Enter')changePassword()"/>
          <button class="input-group-text btn-eye" onclick="togglePw('pwConfirm','eyeConf')"><i class="bi bi-eye" id="eyeConf"></i></button></div></div>
      <div id="pwMsg" class="alert-msg d-none"></div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-outline-secondary rounded-pill" onclick="resetPwForm()"><i class="bi bi-arrow-counterclockwise me-1"></i>Hoàn tác</button>
        <button class="btn-main" id="changePwBtn" onclick="changePassword()">🔒 Đổi mật khẩu</button>
      </div>
    </div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  let currentUser = null;

  function init() {
    currentUser = session.get('customerSession');
    if (!currentUser) { document.getElementById('loginRequiredBox').classList.remove('d-none'); return; }
    document.getElementById('profileWrapper').style.display = '';
    const initials = currentUser.name ? currentUser.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase() : '?';
    document.getElementById('avatarInitials').textContent = initials;
    document.getElementById('sidebarName').textContent = currentUser.name||'–';
    document.getElementById('sidebarEmail').textContent = currentUser.email||'–';
    resetInfoForm();
  }

  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+tab).classList.add('active');
  }

  function resetInfoForm() {
    document.getElementById('infoName').value = currentUser.name||'';
    document.getElementById('infoPhone').value = currentUser.phone||'';
    document.getElementById('infoEmail').value = currentUser.email||'';
    document.getElementById('infoAddress').value = currentUser.address||'';
    document.getElementById('infoMsg').classList.add('d-none');
  }

  async function saveInfo() {
    const name = document.getElementById('infoName').value.trim();
    const phone = document.getElementById('infoPhone').value.trim();
    const email = document.getElementById('infoEmail').value.trim().toLowerCase();
    const address = document.getElementById('infoAddress').value.trim();
    const msg = document.getElementById('infoMsg');
    msg.classList.add('d-none');
    if (!name) { showMsg('infoMsg','Vui lòng nhập họ và tên','err'); return; }
    if (!email) { showMsg('infoMsg','Vui lòng nhập email','err'); return; }
    const btn = document.getElementById('saveInfoBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang lưu...';
    try {
      const updated = await api.customers.updateProfile({ name, phone, email, address });
      const newSess = { ...currentUser, name: updated.name, email: updated.email, phone: updated.phone||'', address: updated.address||'' };
      session.set('customerSession', newSess); currentUser = newSess;
      document.getElementById('sidebarName').textContent = name;
      document.getElementById('sidebarEmail').textContent = email;
      const initials = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      document.getElementById('avatarInitials').textContent = initials;
      showMsg('infoMsg','Lưu thay đổi thành công!','ok');
    } catch(e) { showMsg('infoMsg',e.message||'Lỗi khi lưu','err'); }
    btn.disabled = false; btn.innerHTML = '💾 Lưu thay đổi';
  }

  function togglePw(inputId, iconId) {
    const el=document.getElementById(inputId); const icon=document.getElementById(iconId);
    el.type=el.type==='password'?'text':'password';
    icon.className=el.type==='password'?'bi bi-eye':'bi bi-eye-slash';
  }

  function resetPwForm() {
    ['pwCurrent','pwNew','pwConfirm'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('pwMsg').classList.add('d-none');
  }

  async function changePassword() {
    const cur=document.getElementById('pwCurrent').value;
    const nw=document.getElementById('pwNew').value;
    const conf=document.getElementById('pwConfirm').value;
    if (!cur) { showMsg('pwMsg','Vui lòng nhập mật khẩu hiện tại','err'); return; }
    if (!nw||nw.length<6) { showMsg('pwMsg','Mật khẩu mới phải có ít nhất 6 ký tự','err'); return; }
    if (nw!==conf) { showMsg('pwMsg','Mật khẩu xác nhận không khớp','err'); return; }
    const btn=document.getElementById('changePwBtn');
    btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Đang cập nhật...';
    try {
      await api.customers.changePassword({ oldPassword: cur, newPassword: nw });
      showMsg('pwMsg','Đổi mật khẩu thành công!','ok');
      resetPwForm();
    } catch(e) { showMsg('pwMsg',e.message||'Lỗi khi đổi mật khẩu','err'); }
    btn.disabled=false; btn.innerHTML='🔒 Đổi mật khẩu';
  }

  function showMsg(elId, msg, type) {
    const el=document.getElementById(elId);
    el.className='alert-msg '+(type==='ok'?'alert-ok':'alert-err');
    el.innerHTML=`<i class="bi bi-${type==='ok'?'check-circle':'exclamation-circle'} me-2"></i>${msg}`;
    el.classList.remove('d-none');
    if(type==='ok') setTimeout(()=>el.classList.add('d-none'),3000);
  }

  function doLogout() { if(confirm('Bạn có chắc muốn đăng xuất?')){ session.remove('customerSession'); location.href='/client/login.html'; } }
  init();
</script>
</body></html>
