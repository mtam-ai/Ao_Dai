<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Nhân viên – TranThai Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    body{margin:0;font-family:"Montserrat",sans-serif;background:#f8f9fa}
    .admin-layout{display:flex;min-height:100vh}
    .admin-sidebar{width:230px;background:linear-gradient(180deg,#c8102e,#7a0b1c);padding:24px 16px;min-height:100vh;position:sticky;top:0;display:flex;flex-direction:column;flex-shrink:0}
    .sidebar-brand{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.2)}
    .sidebar-nav{flex:1;margin-top:12px}
    .sidebar-link{display:block;color:rgba(255,255,255,.8);text-decoration:none;padding:11px 14px;border-radius:12px;margin-bottom:4px;font-weight:500;transition:.2s;font-size:14px}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,.2);color:#fff}
    .sidebar-footer{border-top:1px solid rgba(255,255,255,.2);padding-top:16px}
    .content-area{flex:1;padding:28px;background:linear-gradient(135deg,#fff6f0,#ffeaea,#fff5f5);min-height:100vh}
    .form-card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 28px rgba(200,16,46,.1);margin-bottom:20px}
    .table-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(200,16,46,.08)}
    .table thead th{background:#c8102e;color:#fff;font-weight:600;font-size:13px;border:none;padding:12px 14px;white-space:nowrap}
    .table tbody tr{transition:.15s}
    .table tbody tr:hover{background:#fff5f5}
    .table tbody td{vertical-align:middle;font-size:13px;padding:10px 14px;border-color:#f0e0e0}
    .staff-avatar-sm{width:40px;height:40px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background:#c8102e;flex-shrink:0}
    .status-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
    .badge-active{background:#e8f5e9;color:#1b5e20}.badge-inactive{background:#fff3cd;color:#856404}.badge-resigned{background:#f0f0f0;color:#555}
    .btn-restore{background:#d4edda;color:#155724}.btn-restore:hover{background:#28a745;color:#fff}
    .tab-btn{padding:6px 16px;border-radius:20px;border:1.5px solid #dee2e6;background:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;color:#555}
    .tab-btn.active{background:#c8102e;color:#fff;border-color:#c8102e}
    .btn-action{width:32px;height:32px;border-radius:8px;border:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:.15s}
    .btn-edit{background:#fff3cd;color:#856404}.btn-edit:hover{background:#ffc107;color:#fff}
    .btn-del{background:#f8d7da;color:#721c24}.btn-del:hover{background:#c8102e;color:#fff}
    .toast-msg{position:fixed;bottom:28px;right:28px;z-index:99999;border-radius:14px;padding:12px 20px;font-size:13px;font-weight:600;display:flex;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.15);transition:all .3s;opacity:0;pointer-events:none}
    .toast-msg.show{opacity:1}.toast-ok{background:#28a745;color:#fff}.toast-err{background:#c8102e;color:#fff}
  </style>
</head><body>
<div class="admin-layout">
  <div class="admin-sidebar">
    <div class="sidebar-brand">Admin</div>
    <nav class="sidebar-nav">
      <a href="/" class="sidebar-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
      <a href="/admin/staff.html" class="sidebar-link active"><i class="bi bi-people me-2"></i>Nhân viên</a>
      <a href="/admin/customers.html" class="sidebar-link"><i class="bi bi-person-lines-fill me-2"></i>Khách hàng</a>
      <a href="/admin/orders.html" class="sidebar-link"><i class="bi bi-bag-check me-2"></i>Hóa đơn</a>
      <a href="/admin/products.html" class="sidebar-link"><i class="bi bi-box me-2"></i>Sản phẩm</a>
      <a href="/admin/sales.html" class="sidebar-link"><i class="bi bi-graph-up me-2"></i>Doanh thu</a>
    </nav>
    <div class="sidebar-footer">
      <div style="font-size:12px;color:rgba(255,255,255,.5)">Đăng nhập với tư cách</div>
      <div style="font-weight:700;color:#fff;font-size:14px" id="adminName">Admin</div>
      <button class="btn btn-sm btn-outline-light mt-2 w-100" onclick="doLogout()"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
    </div>
  </div>
  <div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="fw-bold" style="color:#c8102e;margin:0">Quản lý nhân viên</h3>
        <p class="text-muted small mb-0" id="subTitle">0 nhân viên</p>
      </div>
      <button class="btn btn-danger" onclick="openAdd()"><i class="bi bi-plus-lg me-2"></i>Thêm nhân viên</button>
    </div>
    <div class="d-flex gap-2 mb-3 align-items-center flex-wrap">
      <button class="tab-btn active" id="tabActive" onclick="setTab('active')">Đang làm việc</button>
      <button class="tab-btn" id="tabResigned" onclick="setTab('resigned')">Đã nghỉ <span id="resignedBadge" class="badge bg-secondary ms-1" style="font-size:10px">0</span></button>
      <input id="searchInput" class="form-control form-control-sm" placeholder="Tìm tên, email..." style="width:220px" oninput="filterStaffs()"/>
      <select id="statusFilter" class="form-select form-select-sm" style="width:160px" onchange="filterStaffs()">
        <option value="">Tất cả trạng thái</option><option value="ACTIVE">Hoạt động</option><option value="INACTIVE">Tạm nghỉ</option>
      </select>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadStaffs()"><i class="bi bi-arrow-clockwise"></i></button>
    </div>

    <div class="form-card d-none" id="staffForm">
      <div class="d-flex justify-content-between mb-3">
        <h6 class="fw-bold mb-0" id="formTitle">Thêm nhân viên</h6>
        <button class="btn btn-sm btn-outline-secondary rounded-circle" onclick="cancelForm()"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="row g-3">
        <div class="col-6"><label class="form-label small fw-bold">Họ và tên *</label><input id="fName" class="form-control"/></div>
        <div class="col-6"><label class="form-label small fw-bold">Email *</label><input id="fEmail" type="email" class="form-control"/></div>
        <div class="col-6"><label class="form-label small fw-bold">Số điện thoại</label><input id="fPhone" class="form-control"/></div>
        <div class="col-6"><label class="form-label small fw-bold">Mật khẩu <span id="pwHint" class="text-muted small">(bắt buộc khi tạo mới)</span></label><input id="fPw" type="password" class="form-control"/></div>
        <div class="col-6"><label class="form-label small fw-bold">Chức vụ</label>
          <select id="fRole" class="form-select" disabled><option value="STAFF" selected>Nhân viên</option></select>
          <input type="hidden" id="fRoleHidden" value="STAFF" />
        </div>
        <div class="col-6"><label class="form-label small fw-bold">Trạng thái</label>
          <select id="fStatus" class="form-select"><option value="ACTIVE">Hoạt động</option><option value="INACTIVE">Tạm nghỉ</option></select></div>
      </div>
      <div id="formAlert" class="alert d-none mt-3 py-2 small"></div>
      <div class="d-flex gap-2 mt-3 justify-content-end">
        <button class="btn btn-outline-secondary" onclick="cancelForm()">Hủy</button>
        <button class="btn btn-danger" onclick="saveStaff()"><i class="bi bi-check-lg me-1"></i><span id="saveLabel">Thêm nhân viên</span></button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
          <tr>
            <th style="width:50px"></th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Số điện thoại</th>
            <th>Chức vụ</th>
            <th>Trạng thái</th>
            <th style="width:90px;text-align:center">Thao tác</th>
          </tr>
          </thead>
          <tbody id="staffTableBody">
          <tr><td colspan="7" class="text-center text-muted py-5">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="toast-msg" id="toastEl"></div>
<script src="/shop-api.js"></script>
<script>
  const sess = session.get('adminSession');
  if (!sess) location.href = '/admin/login.html';
  document.getElementById('adminName').textContent = sess?.name || 'Admin';
  let staffs = [], isEdit = false, editId = null, activeTab = 'active';

  function initials(name) {
    const parts = (name||'NV').trim().split(' ');
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
    return parts[0].substring(0,2).toUpperCase();
  }

  async function loadStaffs() {
    try { staffs = await api.staffs.getAll(); renderAll(); }
    catch(e) { console.error(e); }
  }

  function setTab(tab) {
    activeTab = tab;
    document.getElementById('tabActive').className = tab === 'active' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('tabResigned').className = tab === 'resigned' ? 'tab-btn active' : 'tab-btn';
    filterStaffs();
  }

  function renderAll() {
    const resigned = staffs.filter(s => s.status === 'RESIGNED');
    document.getElementById('resignedBadge').textContent = resigned.length;
    filterStaffs();
  }

  function filterStaffs() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const st = document.getElementById('statusFilter').value;

    let list;
    if (activeTab === 'resigned') {
      list = staffs.filter(s => s.status === 'RESIGNED' && (!q || (s.name||'').toLowerCase().includes(q) || (s.email||'').toLowerCase().includes(q)));
    } else {
      list = staffs.filter(s => {
        const mq = !q||(s.name||'').toLowerCase().includes(q)||(s.email||'').toLowerCase().includes(q);
        return s.status !== 'RESIGNED' && mq && (!st || s.status === st);
      });
    }

    document.getElementById('subTitle').textContent = list.length + ' nhân viên';
    const tbody = document.getElementById('staffTableBody');
    if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5">Không tìm thấy nhân viên</td></tr>'; return; }
    const bmap = {ACTIVE:{c:'badge-active',l:'Hoạt động'},INACTIVE:{c:'badge-inactive',l:'Tạm nghỉ'},RESIGNED:{c:'badge-resigned',l:'Đã nghỉ'}};
    tbody.innerHTML = list.map(s => {
      const b = bmap[s.status]||bmap.ACTIVE;
      const roleLabel = s.role === 'ADMIN' ? 'Admin' : 'Nhân viên';
      const actions = s.status === 'RESIGNED'
              ? `<button class="btn-action btn-restore" onclick="restoreStaff(${s.id})" title="Khôi phục"><i class="bi bi-arrow-counterclockwise"></i></button>`
              : `<button class="btn-action btn-edit" onclick="editStaff(${s.id})" title="Sửa"><i class="bi bi-pencil-fill"></i></button>
           <button class="btn-action btn-del" onclick="resignStaff(${s.id})" title="Chuyển sang đã nghỉ"><i class="bi bi-trash-fill"></i></button>`;
      return `<tr>
        <td>
          <div style="width:40px;height:40px;border-radius:50%;background:${s.status==='RESIGNED'?'#aaa':'#c8102e'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff">
            ${initials(s.name)}
          </div>
        </td>
        <td><div class="fw-bold">${s.name}</div><div class="text-muted" style="font-size:11px">#${s.id}</div></td>
        <td>${s.email||'—'}</td>
        <td>${s.phone||'—'}</td>
        <td><span class="badge bg-light text-dark border" style="font-size:11px">${roleLabel}</span></td>
        <td><span class="status-badge ${b.c}">${b.l}</span></td>
        <td>
          <div style="display:flex;gap:6px;align-items:center;justify-content:center">
            ${actions}
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  function openAdd() {
    isEdit = false; editId = null;
    ['fName','fEmail','fPhone','fPw'].forEach(id => document.getElementById(id).value='');
    document.getElementById('fRole').value = 'STAFF';
    document.getElementById('fRoleHidden').value = 'STAFF';
    document.getElementById('fStatus').value='ACTIVE';
    document.getElementById('formTitle').textContent = '➕ Thêm nhân viên mới';
    document.getElementById('saveLabel').textContent = 'Thêm nhân viên';
    document.getElementById('pwHint').textContent = '(bắt buộc khi tạo mới)';
    document.getElementById('formAlert').classList.add('d-none');
    document.getElementById('staffForm').classList.remove('d-none');
    document.getElementById('staffForm').scrollIntoView({behavior:'smooth'});
  }

  function editStaff(id) {
    const s = staffs.find(x=>x.id===id); if (!s) return;
    isEdit = true; editId = id;
    document.getElementById('fName').value = s.name||'';
    document.getElementById('fEmail').value = s.email||'';
    document.getElementById('fPhone').value = s.phone||'';
    document.getElementById('fPw').value = '';
    document.getElementById('fRole').value = 'STAFF';
    document.getElementById('fRoleHidden').value = 'STAFF';
    document.getElementById('fStatus').value = s.status||'ACTIVE';
    document.getElementById('formTitle').textContent = '✏️ Cập nhật nhân viên';
    document.getElementById('saveLabel').textContent = 'Lưu thay đổi';
    document.getElementById('pwHint').textContent = '(để trống nếu không đổi)';
    document.getElementById('formAlert').classList.add('d-none');
    document.getElementById('staffForm').classList.remove('d-none');
    document.getElementById('staffForm').scrollIntoView({behavior:'smooth'});
  }

  async function saveStaff() {
    const name = document.getElementById('fName').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const pw = document.getElementById('fPw').value;
    if (!name) { showAlert('Vui lòng nhập tên','danger'); return; }
    if (!email) { showAlert('Vui lòng nhập email','danger'); return; }
    if (!isEdit && !pw) { showAlert('Vui lòng nhập mật khẩu','danger'); return; }
    const data = { name, email, phone: document.getElementById('fPhone').value.trim(),
      role: document.getElementById('fRoleHidden').value, status: document.getElementById('fStatus').value };
    if (pw) data.password = pw;
    try {
      if (isEdit) await api.staffs.update(editId, data); else await api.staffs.create(data);
      cancelForm(); loadStaffs(); showToast(isEdit?'Đã cập nhật nhân viên':'Đã thêm nhân viên','ok');
    } catch(e) { showAlert(e.message,'danger'); }
  }

  async function resignStaff(id) {
    if (!confirm('Chuyển nhân viên này sang trạng thái "Đã nghỉ"?')) return;
    const s = staffs.find(x => x.id === id); if (!s) return;
    try {
      await api.staffs.update(id, { name: s.name, email: s.email, phone: s.phone||'', role: s.role||'STAFF', status: 'RESIGNED' });
      loadStaffs(); showToast('Đã chuyển sang trạng thái Đã nghỉ','err');
    } catch(e) { alert(e.message); }
  }

  async function restoreStaff(id) {
    if (!confirm('Khôi phục nhân viên này về trạng thái "Hoạt động"?')) return;
    const s = staffs.find(x => x.id === id); if (!s) return;
    try {
      await api.staffs.update(id, { name: s.name, email: s.email, phone: s.phone||'', role: s.role||'STAFF', status: 'ACTIVE' });
      loadStaffs(); showToast('Đã khôi phục nhân viên','ok');
    } catch(e) { alert(e.message); }
  }

  function cancelForm() { document.getElementById('staffForm').classList.add('d-none'); }
  function showAlert(msg, type) {
    const el = document.getElementById('formAlert');
    el.className = `alert alert-${type} py-2 small mt-3`;
    el.textContent = msg; el.classList.remove('d-none');
    setTimeout(() => el.classList.add('d-none'), 3000);
  }
  function showToast(msg, type) {
    const el = document.getElementById('toastEl');
    el.className = `toast-msg show toast-${type}`;
    el.innerHTML = `<i class="bi bi-${type==='ok'?'check-circle-fill':'person-x-fill'} me-2"></i>${msg}`;
    setTimeout(() => el.classList.remove('show'), 2500);
  }
  function doLogout(){if(confirm('Bạn có chắc muốn đăng xuất?')){session.remove('adminSession');location.href='/admin/login.html';}}
  loadStaffs();
</script>
</body></html>
