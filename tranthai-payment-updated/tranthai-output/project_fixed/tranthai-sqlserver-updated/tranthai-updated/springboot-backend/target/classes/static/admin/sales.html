<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Doanh thu – TranThai Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    body{margin:0;font-family:"Montserrat",sans-serif}
    .admin-layout{display:flex;min-height:100vh}
    .admin-sidebar{width:230px;background:linear-gradient(180deg,#c8102e,#7a0b1c);padding:24px 16px;min-height:100vh;position:sticky;top:0;display:flex;flex-direction:column;flex-shrink:0}
    .sidebar-brand{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.2)}
    .sidebar-nav{flex:1;margin-top:12px}
    .sidebar-link{display:block;color:rgba(255,255,255,.8);text-decoration:none;padding:11px 14px;border-radius:12px;margin-bottom:4px;font-weight:500;transition:.2s;font-size:14px}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,.2);color:#fff}
    .sidebar-footer{border-top:1px solid rgba(255,255,255,.2);padding-top:16px}
    .content{flex:1;padding:40px;background:linear-gradient(135deg,#fff6f0,#ffeaea);min-height:100vh}
    .stat-card{border-radius:16px;padding:20px;color:#fff;text-align:center}
    .stat-revenue{background:linear-gradient(135deg,#c8102e,#8b0000)}.stat-orders{background:linear-gradient(135deg,#0d6efd,#0050c8)}
    .stat-done{background:linear-gradient(135deg,#198754,#0e5236)}.stat-cancelled{background:linear-gradient(135deg,#6c757d,#3d3d3d)}
    .stat-num{font-size:22px;font-weight:800}.stat-label{font-size:12px;opacity:.9;margin-top:2px}
    .status-chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
    .chip-pending{background:#fff3cd;color:#856404}.chip-confirmed{background:#cfe2ff;color:#084298}
    .chip-shipping{background:#d1ecf1;color:#0c5460}.chip-done{background:#d4edda;color:#155724}.chip-cancelled{background:#f8d7da;color:#721c24}
  </style>
</head><body>
<div class="admin-layout">
  <div class="admin-sidebar">
    <div class="sidebar-brand">Admin</div>
    <nav class="sidebar-nav">
      <a href="/" class="sidebar-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
      <a href="/admin/staff.html" class="sidebar-link"><i class="bi bi-people me-2"></i>Nhân viên</a>
      <a href="/admin/customers.html" class="sidebar-link"><i class="bi bi-person-lines-fill me-2"></i>Khách hàng</a>
      <a href="/admin/orders.html" class="sidebar-link"><i class="bi bi-bag-check me-2"></i>Hóa đơn</a>
      <a href="/admin/products.html" class="sidebar-link"><i class="bi bi-box me-2"></i>Sản phẩm</a>
      <a href="/admin/sales.html" class="sidebar-link active"><i class="bi bi-graph-up me-2"></i>Doanh thu</a>
    </nav>
    <div class="sidebar-footer">
      <div style="font-size:12px;color:rgba(255,255,255,.5)">Đăng nhập với tư cách</div>
      <div style="font-weight:700;color:#fff;font-size:14px" id="adminName">Admin</div>
      <button class="btn btn-sm btn-outline-light mt-2 w-100" onclick="doLogout()"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
    </div>
  </div>
  <div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <h3 class="fw-bold mb-0" style="color:#c8102e">Thống kê doanh thu</h3>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <select id="filterMode" class="form-select form-select-sm" style="width:130px" onchange="onFilterChange()">
          <option value="day">Theo ngày</option><option value="month">Theo tháng</option><option value="year">Theo năm</option>
        </select>
        <input type="date" id="filterDay" class="form-control form-control-sm" style="width:160px" onchange="renderAll()"/>
        <select id="filterMonth" class="form-select form-select-sm d-none" style="width:120px" onchange="renderAll()"></select>
        <select id="filterYear" class="form-select form-select-sm" style="width:110px" onchange="renderAll()"></select>
      </div>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-4"><div class="stat-card stat-revenue"><div class="stat-num" id="statRevenue">0 đ</div><div class="stat-label">Doanh thu</div></div></div>
      <div class="col-6 col-md-4"><div class="stat-card stat-done"><div class="stat-num" id="statDone">0</div><div class="stat-label">Đơn hoàn thành</div></div></div>
      <div class="col-6 col-md-4"><div class="stat-card stat-cancelled"><div class="stat-num" id="statCancelled">0</div><div class="stat-label">Đã hủy</div></div></div>
    </div>
    <div class="card overflow-hidden border-0 shadow-sm">
      <div class="px-4 py-3 d-flex justify-content-between" style="background:#fff8f8">
        <span class="fw-bold" style="color:#c8102e">Danh sách đơn hàng</span>
        <span class="text-muted small" id="orderCountLabel">0 đơn</span>
      </div>
      <table class="table table-hover mb-0">
        <thead style="background:#fdf0f0"><tr>
          <th style="color:#c8102e;font-size:13px">Mã đơn</th><th style="color:#c8102e;font-size:13px">Khách hàng</th>
          <th style="color:#c8102e;font-size:13px">Ngày đặt</th><th style="color:#c8102e;font-size:13px">Tổng tiền</th>
          <th style="color:#c8102e;font-size:13px">Trạng thái</th>
        </tr></thead>
        <tbody id="tableBody"><tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm text-danger"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  const sess = session.get('adminSession');
  if (!sess) location.href = '/admin/login.html';
  document.getElementById('adminName').textContent = sess?.name || 'Admin';
  let allOrders = [];
  const today = new Date();

  async function init() {
    const yr = today.getFullYear();
    const yrSel = document.getElementById('filterYear');
    [yr-2,yr-1,yr,yr+1].forEach(y => { const o=document.createElement('option');o.value=y;o.textContent=y;if(y===yr)o.selected=true;yrSel.appendChild(o); });
    document.getElementById('filterDay').value = today.toISOString().slice(0,10);
    const ms = document.getElementById('filterMonth');
    for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent='Tháng '+m;if(m===today.getMonth()+1)o.selected=true;ms.appendChild(o);}
    try {
      allOrders = await api.orders.getAll();
      renderAll();
    } catch(e) { console.error(e); }
  }

  function onFilterChange() {
    const mode = document.getElementById('filterMode').value;
    document.getElementById('filterDay').classList.toggle('d-none', mode!=='day');
    document.getElementById('filterMonth').classList.toggle('d-none', mode!=='month');
    renderAll();
  }

  function parseDate(str){if(!str)return null;const d=new Date(str);return isNaN(d)?null:d;}

  function getFiltered() {
    const mode = document.getElementById('filterMode').value;
    const day = document.getElementById('filterDay').value;
    const month = parseInt(document.getElementById('filterMonth').value);
    const year = parseInt(document.getElementById('filterYear').value);
    return allOrders.filter(o => {
      const d = parseDate(o.orderDate); if(!d) return false;
      if(mode==='day') return d.toISOString().slice(0,10)===day;
      if(mode==='month') return d.getMonth()+1===month && d.getFullYear()===year;
      return d.getFullYear()===year;
    });
  }

  function renderAll() {
    const filtered = getFiltered();
    const done = filtered.filter(o=>o.status==='done');
    const rev = done.reduce((s,o)=>s+Number(o.total||0),0);
    document.getElementById('statRevenue').textContent = fp(rev);
    document.getElementById('statDone').textContent = done.length;
    document.getElementById('statCancelled').textContent = filtered.filter(o=>o.status==='cancelled').length;
    document.getElementById('orderCountLabel').textContent = done.length + ' đơn hoàn thành';
    const tb = document.getElementById('tableBody');
    if (!done.length) { tb.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5">Không có đơn hoàn thành</td></tr>'; return; }
    tb.innerHTML = done.map(o => {
      return `<tr>
        <td><strong style="color:#c8102e">#${String(o.id).slice(-6)}</strong></td>
        <td>${o.customerName||'—'}</td>
        <td class="small text-muted">${o.orderDate?new Date(o.orderDate).toLocaleString('vi-VN'):'—'}</td>
        <td class="fw-bold text-danger">${fp(o.total)}</td>
        <td><span class="status-chip chip-done">Hoàn thành</span></td>
      </tr>`;
    }).join('');
  }

  function fp(p){return Number(p).toLocaleString('vi-VN')+' đ';}
  function doLogout(){if(confirm('Bạn có chắc muốn đăng xuất?')){session.remove('adminSession');location.href='/admin/login.html';}}
  init();
</script>
</body></html>
