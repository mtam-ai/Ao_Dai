<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cổng Nhân Viên – TranThai</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<style>
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff5f5,#ffeaea);display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:24px;padding:40px 36px;width:400px;max-width:96vw;box-shadow:0 20px 60px rgba(200,16,46,.15)}
.brand-logo{font-size:28px;font-weight:800;color:#c8102e;letter-spacing:2px}
.form-control{border-radius:12px;padding:10px 14px}
.form-control:focus{border-color:#c8102e;box-shadow:0 0 0 .15rem rgba(200,16,46,.2)}
.btn-staff{background:linear-gradient(90deg,#c8102e,#a60d1f);border:none;border-radius:12px;padding:10px;color:#fff;font-weight:700}
.btn-staff:hover{color:#fff;opacity:.9}
</style>
</head><body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="brand-logo">Áo Dài Thanh Xuân</div>
    <h5 class="fw-bold mt-2">Cổng nhân viên</h5>
    <p class="text-muted small">Đăng nhập bằng email được cấp</p>
  </div>
  <div class="mb-3"><label class="form-label fw-semibold small">Email</label><input id="email" type="email" class="form-control" placeholder="email@tranthai.vn"/></div>
  <div class="mb-4"><label class="form-label fw-semibold small">Mật khẩu</label><input id="password" type="password" class="form-control" placeholder="••••••" onkeyup="if(event.key==='Enter')doLogin()"/></div>
  <div id="errorMsg" class="alert alert-danger small py-2 d-none"></div>
  <button class="btn btn-staff w-100 fw-bold" onclick="doLogin()" id="loginBtn">Đăng nhập</button>
  <div class="text-center mt-3"><small class="text-muted">Liên hệ admin nếu quên mật khẩu</small></div>
</div>
<script src="/shop-api.js"></script>
<script>
  if (session.get('staffSession')) location.href = '/staff/orders.html';

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('errorMsg');
    errEl.classList.add('d-none');
    if (!email || !password) { errEl.textContent = 'Vui lòng nhập đầy đủ thông tin'; errEl.classList.remove('d-none'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
    try {
      const data = await api.auth.staffLogin(email, password);
      session.set('staffSession', data);
      location.href = '/staff/orders.html';
    } catch(e) {
      errEl.textContent = e.message || 'Email hoặc mật khẩu không đúng!';
      errEl.classList.remove('d-none');
      btn.disabled = false; btn.innerHTML = 'Đăng nhập';
    }
  }
</script>
</body></html>
