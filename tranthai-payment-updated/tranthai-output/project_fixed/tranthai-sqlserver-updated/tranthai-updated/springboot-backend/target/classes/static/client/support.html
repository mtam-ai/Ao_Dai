<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Hỗ trợ khách hàng – Áo Dài Thanh Xuân</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    body{margin:0;font-family:"Montserrat",sans-serif;background:linear-gradient(to bottom,#fff5f5,#fff)}
    .brand-logo{color:#c8102e;font-size:20px;font-weight:800;cursor:pointer}
    .chat-wrapper{max-width:700px;margin:0 auto}
    .not-logged-box{background:#fff;border-radius:24px;padding:52px 40px;text-align:center;box-shadow:0 15px 50px rgba(200,16,46,.12)}
    .chat-box{background:#fff;border-radius:24px;box-shadow:0 15px 50px rgba(200,16,46,.12);overflow:hidden;display:flex;flex-direction:column}
    .chat-top{padding:14px 20px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:12px}
    .chat-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#c8102e,#a60d1f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
    .user-tag-badge{background:#fff0f0;color:#c8102e;border:1px solid #fde0e0;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600}
    .messages-area{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px;height:50vh;min-height:280px}
    .messages-area::-webkit-scrollbar{width:4px}.messages-area::-webkit-scrollbar-thumb{background:#fcc;border-radius:4px}
    .msg-row{display:flex}.msg-left{justify-content:flex-start}.msg-right{justify-content:flex-end}
    .msg-bubble{max-width:68%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
    .bubble-staff{background:#f5f5f5;color:#333;border-bottom-left-radius:4px}
    .bubble-customer{background:linear-gradient(135deg,#c8102e,#a60d1f);color:#fff;border-bottom-right-radius:4px}
    .msg-time{display:block;font-size:10px;opacity:.5;margin-top:4px;text-align:right}
    .staff-name-tag{font-size:11px;font-weight:700;color:#c8102e;margin-bottom:4px}
    .quick-replies{padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid #f5f5f5}
    .quick-btn{background:#fff0f0;color:#c8102e;border:1px solid #fcc;border-radius:20px;padding:5px 13px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s}
    .quick-btn:hover{background:#c8102e;color:#fff}
    .chat-input-row{padding:12px 16px;border-top:1px solid #f5f5f5;display:flex;gap:8px;align-items:center}
    .chat-input{flex:1;border-radius:25px;padding:10px 18px;border:1.5px solid #f0e0e0;font-size:14px;outline:none}
    .chat-input:focus{border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.08)}
    .send-btn{width:42px;height:42px;flex-shrink:0;background:linear-gradient(135deg,#c8102e,#a60d1f);border:none;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .send-btn:hover{transform:scale(1.08)}
    .send-btn:disabled{opacity:.4;cursor:not-allowed}
    .typing-dot{width:7px;height:7px;background:#bbb;border-radius:50%;animation:typing-bounce 1.2s infinite;display:inline-block;margin:0 2px}
    .typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes typing-bounce{0%,80%,100%{transform:scale(.8);opacity:.5}40%{transform:scale(1.2);opacity:1}}
  </style>
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm sticky-top">
  <div class="container d-flex align-items-center justify-content-between">
    <span class="navbar-brand fw-bold brand-logo" onclick="location.href='/client/home.html'">Áo Dài Thanh Xuân</span>
    <span class="fw-semibold text-danger">💬 Hỗ trợ khách hàng</span>
    <div class="d-flex align-items-center gap-2" id="navUserArea"></div>
  </div>
</nav>
<div class="container my-4">
  <div class="chat-wrapper">
    <div id="notLoggedBox" class="not-logged-box d-none">
      <div style="font-size:60px">🔒</div>
      <h5 class="fw-bold mt-3">Vui lòng đăng nhập để chat</h5>
      <p class="text-muted small mb-4">Bạn cần có tài khoản để sử dụng tính năng hỗ trợ</p>
      <div class="d-flex gap-3 justify-content-center">
        <button class="btn btn-danger px-4 rounded-pill fw-bold" onclick="location.href='/client/login.html'"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</button>
        <button class="btn btn-outline-danger px-4 rounded-pill" onclick="location.href='/client/register.html'">Đăng ký</button>
      </div>
      <div class="mt-3"><a class="text-muted small" style="cursor:pointer" onclick="location.href='/client/home.html'">← Quay lại mua sắm</a></div>
    </div>
    <div id="chatBox" class="chat-box d-none">
      <div class="chat-top">
        <div class="chat-av">NV</div>
        <div class="flex-grow-1">
          <div class="fw-bold">Nhân viên TranThai</div>
          <div class="small text-muted">🟢 Đang trực tuyến</div>
        </div>
        <span class="user-tag-badge" id="chatUserTag"></span>
      </div>
      <div class="messages-area" id="messagesArea"></div>
      <div class="quick-replies">
        <button class="quick-btn" onclick="sendQuick('Hỏi về sản phẩm')">Hỏi về sản phẩm</button>
        <button class="quick-btn" onclick="sendQuick('Kiểm tra đơn hàng')">Kiểm tra đơn hàng</button>
        <button class="quick-btn" onclick="sendQuick('Đổi trả hàng')">Đổi trả hàng</button>
        <button class="quick-btn" onclick="sendQuick('Báo lỗi đơn hàng')">Báo lỗi đơn hàng</button>
      </div>
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chatInput" placeholder="Nhập tin nhắn..." onkeyup="if(event.key==='Enter')sendMessage()"/>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
      </div>
    </div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  let currentUser = null, chatId = null, syncInterval = null, welcomeTime = '';

  function now() { return new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); }

  async function init() {
    currentUser = session.get('customerSession');
    const navArea = document.getElementById('navUserArea');
    if (currentUser) {
      navArea.innerHTML = `<i class="bi bi-person-circle text-danger"></i><small class="fw-semibold text-muted">${currentUser.name}</small>
        <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="location.href='/client/home.html'">← Về trang chủ</button>`;
      document.getElementById('chatBox').classList.remove('d-none');
      document.getElementById('chatUserTag').innerHTML = `<i class="bi bi-person-fill me-1"></i>${currentUser.name}`;
      welcomeTime = now();
      await ensureConv();
      loadMessages();
      syncInterval = setInterval(loadMessages, 3000);
    } else {
      document.getElementById('notLoggedBox').classList.remove('d-none');
    }
  }

  async function ensureConv() {
    try {
      const chats = await api.support.getAll();
      const exists = chats.find(c => c.customerId === currentUser.id);
      if (!exists) {
        const newChat = await api.support.openChat(currentUser.id, currentUser.name);
        chatId = newChat.id;
      } else {
        chatId = exists.id;
      }
    } catch(e) { console.error(e); }
  }

  async function loadMessages() {
    if (!chatId) return;
    try {
      const chats = await api.support.getAll();
      const conv = chats.find(c => c.id === chatId);
      if (!conv) return;
      let msgs = []; try { msgs = JSON.parse(conv.messages||'[]'); } catch{}
      const area = document.getElementById('messagesArea');
      let html = `<div class="msg-row msg-left">
        <div class="msg-bubble bubble-staff">Xin chào <strong>${currentUser.name}</strong>! 🌸 Tôi có thể giúp gì cho bạn hôm nay?<span class="msg-time">${welcomeTime}</span></div>
      </div>`;
      if (!msgs.length) {
        html += `<div class="msg-row msg-left"><div class="msg-bubble bubble-staff">
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div></div>`;
      }
      msgs.forEach(m => {
        const cls = m.sender === 'customer' ? 'msg-right' : 'msg-left';
        const bub = m.sender === 'customer' ? 'bubble-customer' : 'bubble-staff';
        const nameTag = m.sender !== 'customer' ? `<div class="staff-name-tag">${m.staffName||'Nhân viên'}</div>` : '';
        html += `<div class="msg-row ${cls}"><div class="msg-bubble ${bub}">${nameTag}<span>${m.text}</span><span class="msg-time">${m.time||''}</span></div></div>`;
      });
      area.innerHTML = html; area.scrollTop = area.scrollHeight;
    } catch(e) {}
  }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !chatId) return;
    try {
      await api.support.sendMessage(chatId, 'customer', text);
      input.value = '';
      loadMessages();
    } catch(e) { console.error(e); }
  }

  function sendQuick(q) { document.getElementById('chatInput').value = q; sendMessage(); }
  window.addEventListener('beforeunload', () => clearInterval(syncInterval));
  init();
</script>
</body></html>
