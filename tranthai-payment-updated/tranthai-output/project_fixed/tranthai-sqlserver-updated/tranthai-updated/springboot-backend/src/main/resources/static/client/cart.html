<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Giỏ hàng – Áo Dài Thanh Xuân</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    body{background:linear-gradient(160deg,#fff8f5,#ffeaea,#fff5f5);min-height:100vh;margin:0}
    .cart-nav{background:#fff;border-bottom:1px solid #f0e8e8;padding:14px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(200,16,46,.07)}
    .brand-logo{font-size:22px;font-weight:900;color:#c8102e;cursor:pointer}
    .cart-body{padding:32px 0 60px}
    .cart-layout{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:flex-start}
    .cart-item{background:#fff;border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(200,16,46,.06);border:2px solid transparent;transition:all .25s}
    .cart-item:hover{border-color:#fde0e0}
    .item-img{width:80px;height:100px;object-fit:cover;border-radius:12px;flex-shrink:0}
    .item-name{font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
    .item-tag{background:#fff0f0;color:#c8102e;border:1px solid #fde0e0;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:600}
    .qty-control{display:flex;align-items:center;background:#f9f0f0;border-radius:12px;overflow:hidden;border:1.5px solid #f0e0e0}
    .qty-btn{width:34px;height:36px;border:none;background:transparent;color:#c8102e;cursor:pointer}
    .qty-btn:hover:not(:disabled){background:#c8102e;color:#fff}
    .qty-btn:disabled{color:#ccc;cursor:not-allowed}
    .qty-input{width:44px;height:36px;border:none;background:transparent;text-align:center;font-size:14px;font-weight:700;outline:none}
    .btn-remove{width:32px;height:32px;border:none;background:#f5f5f5;border-radius:50%;color:#bbb;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .btn-remove:hover{background:#ffe0e0;color:#c8102e}
    .order-summary{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 32px rgba(200,16,46,.1)}
    .subtotal-val,.item-price{font-size:15px;font-weight:800;color:#c8102e}
    .btn-checkout{width:100%;background:linear-gradient(135deg,#c8102e,#a60d1f);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
    .btn-checkout:disabled{opacity:.5;cursor:not-allowed}
    .empty-cart{text-align:center;padding:80px 20px;background:#fff;border-radius:24px;box-shadow:0 8px 32px rgba(200,16,46,.08)}
    .toast-msg{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;border-radius:14px;padding:12px 24px;font-size:14px;font-weight:600;display:flex;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:9999;transition:all .3s;opacity:0;pointer-events:none}
    .toast-msg.show{opacity:1}
    @media(max-width:900px){.cart-layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav class="cart-nav">
  <div class="container d-flex align-items-center justify-content-between">
    <span class="brand-logo" onclick="location.href='/client/home.html'">Áo Dài Thanh Xuân</span>
    <div class="d-flex align-items-center gap-2">
      <span style="font-size:13px;color:#c8102e;cursor:pointer" onclick="location.href='/client/home.html'">Trang chủ</span>
      <i class="bi bi-chevron-right" style="font-size:11px;color:#ccc"></i>
      <span style="font-size:13px;color:#888;font-weight:600">Giỏ hàng</span>
    </div>
    <div id="userTag" style="font-size:13px;color:#666;cursor:pointer" onclick="location.href='/client/login.html'">
      <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
    </div>
  </div>
</nav>
<div class="container cart-body">
  <div id="loginRequired" class="empty-cart d-none">
    <div style="font-size:60px">🔒</div>
    <h4 class="fw-bold mt-3">Vui lòng đăng nhập</h4>
    <p class="text-muted">Bạn cần đăng nhập để xem giỏ hàng</p>
    <button class="btn btn-danger rounded-pill px-4 mt-2" onclick="location.href='/client/login.html'">Đăng nhập</button>
  </div>
  <div id="loadingDiv" class="text-center py-5"><div class="spinner-border text-danger"></div></div>
  <div id="emptyCart" class="empty-cart d-none">
    <div style="font-size:72px">🛒</div>
    <h4>Giỏ hàng của bạn đang trống</h4>
    <p class="text-muted">Hãy khám phá các sản phẩm áo dài đẹp của chúng tôi</p>
    <button class="btn btn-danger rounded-pill px-4 mt-3" onclick="location.href='/client/home.html'"><i class="bi bi-bag me-2"></i>Mua sắm ngay</button>
  </div>
  <div id="cartContent" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 style="font-size:26px;font-weight:800;color:#1a1a1a">🛍 Giỏ hàng <span style="background:#c8102e;color:#fff;font-size:14px;font-weight:700;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center" id="cartCountBadge">0</span></h3>
      <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="location.href='/client/home.html'"><i class="bi bi-arrow-left me-1"></i>Tiếp tục mua sắm</button>
    </div>
    <div class="cart-layout">
      <div>
        <div class="d-flex flex-column gap-2" id="cartItems"></div>
      </div>
      <div style="position:sticky;top:80px">
        <div class="order-summary">
          <h5 style="font-size:17px;font-weight:800;color:#1a1a1a;margin-bottom:16px">Tóm tắt đơn hàng</h5>
          <div id="summaryItems"></div>
          <hr/>
          <div class="d-flex justify-content-between mb-2 small text-muted"><span>Tạm tính</span><span id="subtotalDisplay">—</span></div>
          <div class="d-flex justify-content-between mb-2 small text-muted"><span>Phí vận chuyển</span><span id="shippingDisplay">—</span></div>
          <hr/>
          <div class="d-flex justify-content-between align-items-center mb-3 fw-bold"><span>Tổng cộng</span><span style="font-size:20px;font-weight:900;color:#c8102e" id="totalDisplay">—</span></div>
          <button class="btn-checkout" id="checkoutBtn" onclick="proceedCheckout()">
            <i class="bi bi-bag-check me-2"></i>Thanh toán (<span id="selCount">0</span> sản phẩm đã chọn)
          </button>
          <p class="text-muted small text-center mt-2">Chọn sản phẩm để thanh toán</p>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast-msg" id="toastEl"></div>
<script src="/shop-api.js"></script>
<script>
  const SHIP = 30000;
  let cart = [], selectedKeys = [];
  const user = session.get('customerSession');

  async function init() {
    document.getElementById('loadingDiv').classList.add('d-none');
    if (!user) {
      document.getElementById('loginRequired').classList.remove('d-none');
      return;
    }

    const t = document.getElementById('userTag');
    t.innerHTML = '<i class="bi bi-person-circle me-1"></i>'+user.name;
    t.onclick = null;

    try {
      // Lấy giỏ hàng
      let cartData = await api.cart.get();

      // Lấy danh sách sản phẩm để biết tồn kho
      const allProducts = await api.products.getAll();
      const stockMap = new Map();
      allProducts.forEach(p => {
        stockMap.set(p.id, p.stock || 0);
      });

      // Gán stock cho từng item
      cart = cartData.map(item => ({
        ...item,
        stock: stockMap.get(item.productId) || 999
      }));

    } catch(e) {
      cart = [];
      console.error('Lỗi load cart:', e);
      toast('Lỗi tải giỏ hàng: ' + e.message);
    }
    render();
  }

  function render() {
    if (!cart.length) {
      document.getElementById('emptyCart').classList.remove('d-none');
      document.getElementById('cartContent').classList.add('d-none');
      return;
    }

    document.getElementById('emptyCart').classList.add('d-none');
    document.getElementById('cartContent').classList.remove('d-none');
    document.getElementById('cartCountBadge').textContent = cart.length;

    document.getElementById('cartItems').innerHTML = cart.map(item => {
      const isMaxReached = item.qty >= (item.stock || 999);
      return `
      <div class="cart-item">
        <input type="checkbox" style="width:18px;height:18px;accent-color:#c8102e;cursor:pointer"
          ${selectedKeys.includes(item.cartKey)?'checked':''}
          onchange="toggleItem('${item.cartKey}',this.checked)"/>
        <img src="${item.image||'https://via.placeholder.com/80x100'}" class="item-img"
          onerror="this.src='https://via.placeholder.com/80x100'"/>
        <div style="flex:1;min-width:0">
          <div class="item-name">${item.productName}</div>
          <div class="d-flex flex-wrap gap-1 mb-1">
            ${item.size?`<span class="item-tag">Size ${item.size}</span>`:''}
          </div>
          <div class="small text-muted mt-1">📦 Còn lại: ${item.stock}</div>
        </div>
        <div style="text-align:center;min-width:90px">
          <div style="font-size:14px;font-weight:700;color:#c8102e">${fp(item.price)}</div>
          <div style="font-size:11px;color:#aaa">/ cái</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="chQty(${item.id},'${item.cartKey}',-1)" ${item.qty<=1?'disabled':''}>
            <i class="bi bi-dash"></i>
          </button>
          <input class="qty-input" type="number" value="${item.qty}" min="1" readonly/>
          <button class="qty-btn" onclick="chQty(${item.id},'${item.cartKey}',1)" ${isMaxReached ? 'disabled' : ''}>
            <i class="bi bi-plus"></i>
          </button>
        </div>
        <div style="text-align:right;min-width:100px">
          <span class="subtotal-val">${fp(item.price*item.qty)}</span>
        </div>
        <button class="btn-remove" onclick="removeItem('${item.cartKey}')">
          <i class="bi bi-x-lg" style="font-size:12px"></i>
        </button>
      </div>`;
    }).join('');
    updateSummary();
  }

  async function chQty(id, cartKey, delta) {
    const item = cart.find(i => i.cartKey === cartKey);
    if (!item) return;

    const newQty = item.qty + delta;
    if (newQty < 1) return;

    // Kiểm tra tồn kho
    if (delta === 1 && newQty > item.stock) {
      toast(`❌ Không thể tăng! Sản phẩm chỉ còn ${item.stock} cái.`);
      return;
    }

    try {
      const updated = await api.cart.updateQty(id, newQty);
      item.qty = updated.qty;
      render();
      toast(`✅ Đã cập nhật: ${item.productName} x${item.qty}`);
    } catch(e) {
      toast(e.message || 'Lỗi cập nhật số lượng');
    }
  }

  async function removeItem(cartKey) {
    try {
      await api.cart.remove(cartKey);
      cart = cart.filter(i => i.cartKey !== cartKey);
      selectedKeys = selectedKeys.filter(k => k !== cartKey);
      render();
      toast('🗑 Đã xóa sản phẩm khỏi giỏ hàng');
    } catch(e) {
      toast(e.message);
    }
  }

  function toggleItem(key, checked) {
    if (checked) {
      if (!selectedKeys.includes(key)) selectedKeys.push(key);
    } else {
      selectedKeys = selectedKeys.filter(k => k !== key);
    }
    updateSummary();
  }

  function updateSummary() {
    const sel = cart.filter(i => selectedKeys.includes(i.cartKey));
    const total = sel.reduce((s,i) => s + Number(i.price) * Number(i.qty), 0);
    document.getElementById('selCount').textContent = sel.length;
    document.getElementById('subtotalDisplay').textContent = total > 0 ? fp(total) : '—';
    document.getElementById('shippingDisplay').textContent = total > 0 ? fp(SHIP) : '—';
    document.getElementById('totalDisplay').textContent = total > 0 ? fp(total + SHIP) : '—';
    document.getElementById('checkoutBtn').disabled = sel.length === 0;

    document.getElementById('summaryItems').innerHTML = sel.length === 0
            ? '<p class="text-muted small text-center">Chọn sản phẩm để thanh toán</p>'
            : sel.map(i => `
        <div class="d-flex align-items-center gap-2 mb-2">
          <img src="${i.image||'https://via.placeholder.com/44'}" style="width:44px;height:54px;object-fit:cover;border-radius:8px"
            onerror="this.src='https://via.placeholder.com/44'"/>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.productName}</div>
            <small class="text-muted">x${i.qty}</small>
          </div>
          <div style="font-size:13px;font-weight:700;color:#c8102e">${fp(i.price * i.qty)}</div>
        </div>
      `).join('');
  }

  function proceedCheckout() {
    if (!selectedKeys.length) return;
    sessionStorage.setItem('checkoutKeys', JSON.stringify(selectedKeys));
    location.href = '/client/checkout.html';
  }

  function toast(msg) {
    const el = document.getElementById('toastEl');
    el.innerHTML = `<i class="bi bi-info-circle me-2"></i>${msg}`;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  function fp(p) {
    return Number(p).toLocaleString('vi-VN') + ' đ';
  }

  init();
</script>
</body>
</html>
