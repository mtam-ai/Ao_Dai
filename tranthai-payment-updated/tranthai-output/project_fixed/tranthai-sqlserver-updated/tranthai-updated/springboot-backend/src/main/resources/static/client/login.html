<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Đăng nhập – Áo Dài Thanh Xuân</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
<style>
body{margin:0}.auth-page{min-height:100vh;background:linear-gradient(135deg,#fff5f5,#ffeaea);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.mai-container{position:fixed;inset:0;pointer-events:none;z-index:0}
.mai{position:absolute;top:-10%;font-size:22px;animation:mai-fall linear infinite;opacity:.6}
@keyframes mai-fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(110vh) rotate(360deg)}}
.auth-card{background:#fff;border-radius:24px;padding:40px 44px;width:440px;max-width:96vw;box-shadow:0 20px 60px rgba(200,16,46,.14);position:relative;z-index:1}
.brand-logo{font-size:30px;font-weight:900;color:#c8102e;letter-spacing:2px;cursor:pointer}
.input-group-text{background:#fff5f5;border-color:#eee;color:#c8102e}
.btn-eye{cursor:pointer;background:#fff5f5;border-color:#eee}
.form-control{border-color:#eee;padding:10px 14px}
.form-control:focus{border-color:#c8102e;box-shadow:0 0 0 .15rem rgba(200,16,46,.15)}
.btn-main{background:linear-gradient(90deg,#c8102e,#a60d1f);color:#fff;border:none;border-radius:14px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;transition:.3s;width:100%}
.btn-main:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(200,16,46,.3)}
.btn-main:disabled{opacity:.7;cursor:not-allowed}
.alert-msg{border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.alert-err{background:#fff5f5;border:1px solid #fcc;color:#c8102e}
.link-red{color:#c8102e;font-weight:600;cursor:pointer}
.link-muted{color:#aaa;font-size:13px;cursor:pointer}
.link-muted:hover{color:#c8102e}
.forgot-link{font-size:13px;font-weight:600;color:#c8102e;cursor:pointer}
.divider{text-align:center;position:relative;margin:16px 0}
.divider::before{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:#eee}
.divider span{background:#fff;padding:0 12px;color:#aaa;font-size:13px;position:relative}
.section{display:none}.section.active{display:block}
.step-back{display:inline-flex;align-items:center;color:#c8102e;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;padding:6px 12px;border-radius:20px;border:1px solid #fde0e0;background:#fff8f8;transition:.2s}
.step-back:hover{background:#c8102e;color:#fff;border-color:#c8102e}
</style>
</head><body>
<div class="auth-page">
  <div class="mai-container">
    <span class="mai" style="left:18%;animation-duration:3.6s">🌸</span>
    <span class="mai" style="left:36%;animation-duration:4.2s">🌼</span>
    <span class="mai" style="left:54%;animation-duration:4.8s">🌸</span>
    <span class="mai" style="left:72%;animation-duration:5.4s">🌼</span>
    <span class="mai" style="left:90%;animation-duration:6s">🌸</span>
  </div>
  <div class="auth-card">
    <!-- ĐĂNG NHẬP -->
    <div id="sec-login" class="section active">
      <div class="text-center mb-4">
        <div class="brand-logo" onclick="location.href='/client/home.html'">Áo Dài Thanh Xuân</div>
        <h5 class="fw-bold mt-2">Đăng nhập</h5>
        <p class="text-muted small">Chào mừng bạn quay lại!</p>
      </div>
      <div class="mb-3"><label class="form-label small fw-semibold">Email</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input id="loginEmail" type="email" class="form-control" placeholder="example@email.com" onkeyup="if(event.key==='Enter')doLogin()"/></div></div>
      <div class="mb-2"><label class="form-label small fw-semibold">Mật khẩu</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input id="loginPw" type="password" class="form-control" placeholder="••••••" onkeyup="if(event.key==='Enter')doLogin()"/>
          <button class="input-group-text btn-eye" onclick="togglePw('loginPw','eyeLogin')"><i class="bi bi-eye" id="eyeLogin"></i></button></div></div>
      <div class="text-end mb-3"><span class="forgot-link" onclick="showSection('sec-forgot')">Quên mật khẩu?</span></div>
      <div id="loginErr" class="alert-msg alert-err d-none"></div>
      <button class="btn-main mb-3" id="loginBtn" onclick="doLogin()">🌸 Đăng nhập</button>
      <div class="divider"><span>hoặc</span></div>
      <div class="text-center small mt-3">Chưa có tài khoản? <span class="link-red" onclick="location.href='/client/register.html'">Đăng ký ngay</span></div>
      <div class="text-center mt-2"><span class="link-muted" onclick="location.href='/client/home.html'">← Về trang chủ</span></div>
    </div>
    <!-- QUÊN MẬT KHẨU - thông báo liên hệ -->
    <div id="sec-forgot" class="section">
      <span class="step-back" onclick="showSection('sec-login')"><i class="bi bi-arrow-left me-1"></i>Quay lại</span>
      <div class="text-center mb-4">
        <div style="font-size:52px">🔑</div>
        <h5 class="fw-bold mt-3">Quên mật khẩu</h5>
        <p class="text-muted small">Vui lòng liên hệ cửa hàng để được hỗ trợ đặt lại mật khẩu</p>
        <button class="btn btn-danger rounded-pill px-4 mt-2" onclick="location.href='/client/support.html'"><i class="bi bi-chat-dots me-2"></i>Liên hệ hỗ trợ</button>
      </div>
    </div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  if (session.get('customerSession')) {
    const redirect = new URLSearchParams(location.search).get('redirect') || '/client/home.html';
    location.href = redirect;
  }

  function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function togglePw(inputId, iconId) {
    const el = document.getElementById(inputId); const icon = document.getElementById(iconId);
    el.type = el.type === 'password' ? 'text' : 'password';
    icon.className = el.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPw').value;
    const errEl = document.getElementById('loginErr');
    errEl.classList.add('d-none');
    if (!email || !pw) { errEl.textContent = 'Vui lòng nhập đầy đủ thông tin'; errEl.classList.remove('d-none'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
    try {
      const data = await api.auth.customerLogin(email, pw);
      session.set('customerSession', data);
      const redirect = new URLSearchParams(location.search).get('redirect') || '/client/home.html';
      location.href = redirect;
    } catch(e) {
      errEl.textContent = e.message || 'Email hoặc mật khẩu không đúng!';
      errEl.classList.remove('d-none');
      btn.disabled = false; btn.innerHTML = '🌸 Đăng nhập';
    }
  }
</script>
</body></html>
