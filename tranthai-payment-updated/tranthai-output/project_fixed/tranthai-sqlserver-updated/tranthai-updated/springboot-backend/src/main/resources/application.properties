# ============================================================
#  TranThai Backend ? Application Configuration
# ============================================================

spring.application.name=tranthai-backend
server.port=8080

# ?? Database: SQL Server ??????????????????????????????????
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TranThaiDB;encrypt=false;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=tranthai

# ?? JPA / Hibernate ??????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ?? JWT ??????????????????????????????????????????????????
app.jwt.secret=tranthai-super-secret-jwt-key-2024-change-in-production
app.jwt.expiration-ms=86400000

# ?? CORS ?????????????????????????????????????????????????
app.cors.allowed-origins=http://localhost:8080

# ?? Logging ??????????????????????????????????????????????
logging.level.com.tranthai=INFO
logging.level.org.springframework.security=WARN

