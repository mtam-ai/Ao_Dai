<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Đăng ký – Áo Dài Thanh Xuân</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
<style>
body{margin:0}.auth-page{min-height:100vh;background:linear-gradient(135deg,#fff5f5,#ffeaea);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.mai{position:absolute;top:-10%;font-size:22px;animation:mai-fall linear infinite;opacity:.6}
@keyframes mai-fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(110vh) rotate(360deg)}}
.auth-card{background:#fff;border-radius:24px;padding:36px 40px;width:520px;max-width:98vw;box-shadow:0 20px 60px rgba(200,16,46,.14);position:relative;z-index:1}
.brand-logo{font-size:28px;font-weight:900;color:#c8102e;letter-spacing:2px;cursor:pointer}
.form-control{border-radius:12px;padding:10px 14px;border-color:#eee;transition:.2s}
.form-control:focus{border-color:#c8102e;box-shadow:0 0 0 .15rem rgba(200,16,46,.15)}
.btn-register{background:linear-gradient(90deg,#c8102e,#a60d1f);color:#fff;border:none;border-radius:14px;padding:12px;font-weight:700;font-size:15px;transition:.3s}
.btn-register:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(200,16,46,.3);color:#fff}
.btn-register:disabled{opacity:.7;cursor:not-allowed}
.input-eye{position:relative}.input-eye .form-control{padding-right:42px}
.btn-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#aaa;cursor:pointer}
</style>
</head><body>
<div class="auth-page">
  <span class="mai" style="left:18%;animation-duration:3.6s;z-index:0">🌸</span>
  <span class="mai" style="left:54%;animation-duration:4.8s;z-index:0">🌼</span>
  <span class="mai" style="left:90%;animation-duration:6s;z-index:0">🌸</span>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-logo" onclick="location.href='/client/home.html'">Áo Dài Thanh Xuân</div>
      <h5 class="fw-bold mt-2">Tạo tài khoản</h5>
      <p class="text-muted small">Đăng ký để trải nghiệm mua sắm tốt hơn</p>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-6"><label class="form-label small fw-semibold">Họ và tên <span class="text-danger">*</span></label><input id="name" class="form-control" placeholder="Nguyễn Văn A"/></div>
      <div class="col-6"><label class="form-label small fw-semibold">Số điện thoại <span class="text-danger">*</span></label><input id="phone" class="form-control" placeholder="0xxxxxxxxx" maxlength="11"/></div>
      <div class="col-12"><label class="form-label small fw-semibold">Email <span class="text-danger">*</span></label><input id="email" type="email" class="form-control" placeholder="example@email.com"/></div>
      <div class="col-12"><label class="form-label small fw-semibold">Địa chỉ nhận hàng</label><input id="address" class="form-control" placeholder="Số nhà, đường, phường/xã..."/></div>
      <div class="col-6"><label class="form-label small fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
        <div class="input-eye"><input id="password" type="password" class="form-control" placeholder="••••••"/>
          <button class="btn-eye" onclick="togglePw('password','eyePw')"><i class="bi bi-eye" id="eyePw"></i></button></div></div>
      <div class="col-6"><label class="form-label small fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
        <div class="input-eye"><input id="confirmPassword" type="password" class="form-control" placeholder="••••••" onkeyup="if(event.key==='Enter')doRegister()"/>
          <button class="btn-eye" onclick="togglePw('confirmPassword','eyeConf')"><i class="bi bi-eye" id="eyeConf"></i></button></div></div>
    </div>
    <div id="globalError" class="alert alert-danger py-2 small d-none"></div>
    <div id="successMsg" class="alert alert-success py-2 small d-none"></div>
    <button class="btn btn-register w-100 mb-3" id="registerBtn" onclick="doRegister()">🌸 Đăng ký ngay</button>
    <div class="text-center small">Đã có tài khoản? <span class="text-danger fw-semibold" style="cursor:pointer" onclick="location.href='/client/login.html'">Đăng nhập</span></div>
  </div>
</div>
<script src="/shop-api.js"></script>
<script>
  if (session.get('customerSession')) location.href = '/client/home.html';

  function togglePw(id, iconId) {
    const el = document.getElementById(id); const icon = document.getElementById(iconId);
    el.type = el.type === 'password' ? 'text' : 'password';
    icon.className = el.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  }

  async function doRegister() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const pw = document.getElementById('password').value;
    const cpw = document.getElementById('confirmPassword').value;
    const errEl = document.getElementById('globalError');
    const okEl = document.getElementById('successMsg');
    errEl.classList.add('d-none'); okEl.classList.add('d-none');
    if (!name) { errEl.textContent = 'Vui lòng nhập họ và tên'; errEl.classList.remove('d-none'); return; }
    if (!email) { errEl.textContent = 'Vui lòng nhập email'; errEl.classList.remove('d-none'); return; }
    if (!pw) { errEl.textContent = 'Vui lòng nhập mật khẩu'; errEl.classList.remove('d-none'); return; }
    if (pw.length < 6) { errEl.textContent = 'Mật khẩu phải có ít nhất 6 ký tự'; errEl.classList.remove('d-none'); return; }
    if (pw !== cpw) { errEl.textContent = 'Mật khẩu xác nhận không khớp'; errEl.classList.remove('d-none'); return; }
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng ký...';
    try {
      await api.auth.register({ name, email, password: pw, phone, address });
      okEl.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>🎉 Đăng ký thành công! Đang chuyển đến trang đăng nhập...';
      okEl.classList.remove('d-none');
      setTimeout(() => location.href = '/client/login.html', 1500);
    } catch(e) {
      errEl.textContent = e.message || 'Đăng ký thất bại';
      errEl.classList.remove('d-none');
      btn.disabled = false; btn.innerHTML = '🌸 Đăng ký ngay';
    }
  }
</script>
</body></html>
